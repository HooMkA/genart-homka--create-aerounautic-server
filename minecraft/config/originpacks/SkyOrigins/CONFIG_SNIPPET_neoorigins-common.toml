# Важно: этот V2-пак переопределяет встроенные IDs neoorigins:human/dwarf/avian/merling.
# Поэтому эти 4 origin должны быть TRUE, все остальные — FALSE.

[origins]
human = true
merling = true
avian = true
dwarf = true
# all other origins = false

[evolution]
enabled = true
